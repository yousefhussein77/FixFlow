openapi: 3.1.0
info:
  title: FixFlow Technician Ticket Processing API
  version: 1.0.0
  description: >-
    Additive Version 1 contract for technician-private assigned work, assigned-ticket details and
    immutable history, and exactly four processing transitions. Discussions, ratings, assignment
    changes, deletion, reference-data management, and unsupported transitions are not exposed.
servers:
  - url: /api
security:
  - sanctumBearer: []
paths:
  /technician/tickets:
    get:
      operationId: listTechnicianTickets
      summary: List only tickets currently assigned to the authenticated technician
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/TechnicianTicketList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
  /technician/tickets/{reference}:
    get:
      operationId: showTechnicianTicket
      summary: View one currently assigned ticket with chronological history
      parameters:
        - $ref: '#/components/parameters/TicketReference'
      responses:
        '200':
          $ref: '#/components/responses/TechnicianTicketDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /technician/tickets/{reference}/status:
    patch:
      operationId: transitionTechnicianTicketStatus
      summary: Apply one permitted processing transition to a currently assigned ticket
      parameters:
        - $ref: '#/components/parameters/TicketReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusTransitionRequest'
            examples:
              startWork:
                value: {status: in_progress}
              completeWork:
                value: {status: completed}
              rejectWork:
                value: {status: rejected, reason: Required replacement part is unavailable.}
      responses:
        '200':
          $ref: '#/components/responses/StatusTransitionSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          $ref: '#/components/responses/StatusTransitionConflict'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TicketReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        pattern: '^TKT-[A-Z0-9]{12}$'
  schemas:
    NamedReference:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string, minLength: 1}
    TechnicianSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string, minLength: 1}
    Photo:
      type: object
      additionalProperties: false
      required: [id, name, mime_type, size, position]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string, minLength: 1}
        mime_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size: {type: integer, minimum: 1, maximum: 10485760}
        position: {type: integer, minimum: 0, maximum: 4}
    ProcessingStatus:
      type: string
      enum: [assigned, in_progress, completed, rejected]
    TechnicianTicketSummary:
      type: object
      additionalProperties: false
      required: [reference, title, priority, department, category, status, created_at]
      properties:
        reference:
          type: string
          pattern: '^TKT-[A-Z0-9]{12}$'
        title: {type: string, minLength: 1, maxLength: 160}
        priority: {type: string, enum: [low, medium, high, urgent]}
        department: {$ref: '#/components/schemas/NamedReference'}
        category: {$ref: '#/components/schemas/NamedReference'}
        status: {$ref: '#/components/schemas/ProcessingStatus'}
        created_at: {type: string, format: date-time}
    StatusHistoryEntry:
      type: object
      additionalProperties: false
      required: [from_status, to_status, actor, assigned_technician, occurred_at, reason]
      properties:
        from_status:
          type: string
          enum: [new, assigned, in_progress]
        to_status:
          type: string
          enum: [assigned, in_progress, completed, rejected]
        actor: {$ref: '#/components/schemas/TechnicianSummary'}
        assigned_technician: {$ref: '#/components/schemas/TechnicianSummary'}
        occurred_at: {type: string, format: date-time}
        reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 1000
            - type: 'null'
    TechnicianTicketDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/TechnicianTicketSummary'
        - type: object
          required: [description, location, assigned_technician, photos, status_history, updated_at]
          properties:
            description: {type: string, minLength: 1, maxLength: 5000}
            location: {type: string, minLength: 1, maxLength: 255}
            assigned_technician: {$ref: '#/components/schemas/TechnicianSummary'}
            photos:
              type: array
              maxItems: 5
              items: {$ref: '#/components/schemas/Photo'}
            status_history:
              type: array
              items: {$ref: '#/components/schemas/StatusHistoryEntry'}
            updated_at: {type: string, format: date-time}
    StatusTransitionRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed, rejected]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required when status is rejected; omitted for in_progress or completed.
      allOf:
        - if:
            properties:
              status: {const: rejected}
          then:
            required: [reason]
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        last_page: {type: integer, minimum: 1}
    ErrorMap:
      oneOf:
        - type: object
          additionalProperties:
            type: array
            items: {type: string}
        - type: 'null'
    TicketListEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, data, errors, code, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/TechnicianTicketSummary'}
        errors: {type: 'null'}
        code: {type: 'null'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    TicketDetailEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, data, errors, code]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/TechnicianTicketDetail'}
        errors: {type: 'null'}
        code: {type: 'null'}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, message, data, errors, code]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        data: {type: 'null'}
        errors: {$ref: '#/components/schemas/ErrorMap'}
        code: {type: string, minLength: 1}
  responses:
    TechnicianTicketList:
      description: Stable newest-first page scoped before counts to the current technician
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TicketListEnvelope'}
    TechnicianTicketDetail:
      description: Currently assigned ticket with chronological immutable history
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TicketDetailEnvelope'}
    StatusTransitionSuccess:
      description: Authoritative detail after ticket status and one history row commit atomically
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TicketDetailEnvelope'}
    Validation:
      description: VALIDATION_ERROR for pagination, status shape, or rejection reason
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {const: VALIDATION_ERROR}
          examples:
            rejectionReason:
              value:
                success: false
                message: The submitted data is invalid.
                data: null
                errors:
                  reason: [A rejection reason is required.]
                code: VALIDATION_ERROR
    Unauthenticated:
      description: Missing, invalid, revoked, or inactive-account authentication; no ticket data
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {const: UNAUTHENTICATED}
          example:
            success: false
            message: Authentication required.
            data: null
            errors: null
            code: UNAUTHENTICATED
    Forbidden:
      description: Authenticated actor lacks technician authority; no ticket data, counts, or clues
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {const: FORBIDDEN}
          example:
            success: false
            message: You are not authorized to perform this action.
            data: null
            errors: null
            code: FORBIDDEN
    TicketNotFound:
      description: >-
        TICKET_NOT_FOUND; identical public outcome for unknown and not-currently-assigned tickets.
        No ticket, assignment, history, or existence data is included.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {const: TICKET_NOT_FOUND}
          example:
            success: false
            message: Ticket not found.
            data: null
            errors: null
            code: TICKET_NOT_FOUND
    StatusTransitionConflict:
      description: Current assignment/status no longer permits the request; authoritative refresh required
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {const: STATUS_TRANSITION_CONFLICT}
          example:
            success: false
            message: The ticket status changed or this transition is no longer allowed. Refresh and review the current state.
            data: null
            errors: null
            code: STATUS_TRANSITION_CONFLICT
    ServerError:
      description: Sanitized unexpected failure; transaction leaves ticket and history unchanged
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {const: SERVER_ERROR}
          example:
            success: false
            message: An unexpected server error occurred.
            data: null
            errors: null
            code: SERVER_ERROR
