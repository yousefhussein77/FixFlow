openapi: 3.1.0
info: {title: FixFlow Reference Data API, version: 1.0.0}
paths:
  /api/admin/departments:
    get: {summary: List all departments, responses: {'200': {description: Success}, '401': {description: Unauthenticated}, '403': {description: Forbidden}}}
    post: {summary: Create department, responses: {'201': {description: Created}, '422': {description: Validation}}}
  /api/admin/departments/{id}:
    get: {summary: View department, responses: {'200': {description: Success}, '404': {description: Not found}}}
    put: {summary: Update department with name and version, responses: {'200': {description: Success}, '409': {description: Stale conflict}, '422': {description: Validation}}}
  /api/admin/departments/{id}/activate:
    patch: {summary: Activate department with version, responses: {'200': {description: Success}, '409': {description: Conflict}}}
  /api/admin/departments/{id}/deactivate:
    patch: {summary: Deactivate department with version, responses: {'200': {description: Success}, '409': {description: Conflict}}}
  /api/admin/categories:
    get: {summary: List all categories, responses: {'200': {description: Success}}}
    post: {summary: Create category, responses: {'201': {description: Created}, '422': {description: Validation}}}
  /api/admin/categories/{id}:
    get: {summary: View category, responses: {'200': {description: Success}, '404': {description: Not found}}}
    put: {summary: Update category with department, name, and version, responses: {'200': {description: Success}, '409': {description: Conflict}, '422': {description: Validation}}}
  /api/admin/categories/{id}/activate:
    patch: {summary: Activate category, responses: {'200': {description: Success}, '409': {description: Conflict}}}
  /api/admin/categories/{id}/deactivate:
    patch: {summary: Deactivate category, responses: {'200': {description: Success}, '409': {description: Conflict}}}
  /api/options/departments:
    get: {summary: Active department options, responses: {'200': {description: Success}, '401': {description: Unauthenticated}}}
  /api/options/departments/{departmentId}/categories:
    get: {summary: Active category options, responses: {'200': {description: Success}, '422': {description: Invalid or inactive department}}}
